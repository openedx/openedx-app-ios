API_HOST_URL: 'http://localhost:8000'
SSO_URL: 'http://localhost:8000'
SSO_FINISHED_URL: 'http://localhost:8000'
ENVIRONMENT_DISPLAY_NAME: 'Localhost'
FEEDBACK_EMAIL_ADDRESS: 'support@example.com'
OAUTH_CLIENT_ID: ''

# Remote instances-catalog endpoint. Empty/unset -- the app falls back to the
# catalog bundled with the binary (see default_config/dev/config.json and
# Core/Core/Configuration/Config/InstanceConfigLoader.swift).
INSTANCES_CATALOG_URL: ''

SSO_BUTTON_TITLE:
    ar: "الدخول عبر SSO"
    en: "Sign in with SSO"

APP_LEVEL_DATES_ENABLED: false

EXPERIMENTAL_FEATURES:
    APP_LEVEL_DOWNLOADS:
        ENABLED: false

UI_COMPONENTS:
    COURSE_UNIT_PROGRESS_ENABLED: false
    COURSE_NESTED_LIST_ENABLED: false
    LOGIN_REGISTRATION_ENABLED: true
    SAML_SSO_LOGIN_ENABLED: false
    SAML_SSO_DEFAULT_LOGIN_BUTTON: false


# Multi-instance configuration. Each INSTANCES entry overrides the top-level
# values above for that instance; fields it omits fall back to them via
# InstancesConfig.init(array:fallback:) — see
# Core/Core/Configuration/Config/InstancesConfig.swift.
INSTANCES:
  -
    KEY: "example-instance"
    name: "Example Instance"
    INSTANCE_NAME:
        ar: "اسم المُزود"
        en: "Example Instance"
    ENVIRONMENT_DISPLAY_NAME: "Example Instance"
    OAUTH_CLIENT_ID: 'example-oauth-client-id'
    API_HOST_URL: 'https://example-instance.example.com'
    SSO_URL: 'https://example-instance.example.com/auth/login/tpa-saml/?auth_entry=login'
    SSO_URL_SUCCESSFUL_LOGIN: "https://example-instance.example.com/auth/login/tpa-saml/auth/complete/tpa-saml"
    SSO_BUTTON_TITLE:
        ar: "الدخول عبر SSO"
        en: "Sign in with SSO"
    IS_SWITCH_INSTANCE_LOGIN_ENABLED: true

    # `light`/`dark` need only override the colors an instance actually wants to brand --
    # everything else derives from `accent_color` (see ThemeColorSet.derived(fromHex:light:dark:)
    # in Theme/Theme/ThemeColorSet.swift). `logo_url`/`header_background_url` are optional and
    # apply to both modes; omit either to keep the compiled default asset.
    THEME:
        light:
            accent_color: "#3C68FF"
        dark:
            accent_color: "#1C355E"
        logo_url: "exampleInstanceAppLogo"

    UI_COMPONENTS:
        COURSE_UNIT_PROGRESS_ENABLED: false
        COURSE_NESTED_LIST_ENABLED: false
        LOGIN_REGISTRATION_ENABLED: true
        SAML_SSO_LOGIN_ENABLED: false
        SAML_SSO_DEFAULT_LOGIN_BUTTON: false
